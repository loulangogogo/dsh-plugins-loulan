<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-loulan-mcp · 「MCP」标签页 显示演示</title>
<!--
  用途：在浏览器里先讨论并敲定「MCP」标签页的显示样式，定稿后再统一改回插件。

  三条对应关系（改这里 = 改那里）：
  1. 第 3 段的 `.dsh-mcp-*` 样式是**候选设计**：定稿后整段替换 packages/mcp/src/client/styles.ts 的 CSS 段。
     其中「工具条」相关样式目前有三个方案（见页面上的「工具条方案」切换）。
  2. 页面结构（render() 生成的 DOM）对应 packages/mcp/src/client/McpView.tsx 的 JSX。
  3. 样例数据形状对应 src/contract.ts 的 McpMountedData = { global, workspace, manual }。

  第 1 段的主题 token 抄自 harness 的 packages/client/ui-theme/src/styles/design-platform.css，
  目的是让演示页在明/暗两种主题下都与真实界面同色。这些值不需要搬回插件。
-->
<style>
/* ───────────────────────── 1. 主题 token（抄自 ui-theme，仅供演示页还原真实配色） ───────────────────────── */
:root {
  --dsw-alias-bg-base: rgb(255, 255, 255);
  --dsw-alias-bg-layer-2: rgb(255, 255, 255);
  --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-alias-label-primary: rgb(15, 17, 21);
  --dsw-alias-label-secondary: rgb(97, 102, 107);
  --dsw-alias-label-tertiary: rgb(129, 133, 140);
  --dsw-alias-label-caption: rgb(173, 178, 184);
  --dsw-alias-state-business-primary: rgb(65, 118, 230);
  --dsw-alias-state-success-primary: rgb(34, 197, 94);
  --dsw-alias-state-error-primary: rgb(236, 19, 19);
  --dsw-specific-tip: rgb(245, 246, 247);
  --demo-shell-bg: rgb(249, 250, 251);
  --demo-shell-line: rgba(0, 0, 0, 0.08);
}

html[data-theme="dark"] {
  --dsw-alias-bg-base: rgb(21, 21, 23);
  --dsw-alias-bg-layer-2: rgb(44, 44, 46);
  --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
  --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-alias-label-primary: rgb(249, 250, 251);
  --dsw-alias-label-secondary: rgb(207, 211, 214);
  --dsw-alias-label-tertiary: rgb(173, 178, 184);
  --dsw-alias-label-caption: rgb(129, 133, 140);
  --dsw-alias-state-business-primary: rgb(103, 158, 254);
  --dsw-alias-state-success-primary: rgb(34, 197, 94);
  --dsw-alias-state-error-primary: rgb(242, 90, 90);
  --dsw-specific-tip: rgb(53, 54, 56);
  --demo-shell-bg: rgb(21, 21, 23);
  --demo-shell-line: rgba(255, 255, 255, 0.12);
}

/* ───────────────────────── 2. 演示外壳（不属于 MCP 视图，定稿时不要搬回） ───────────────────────── */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: var(--demo-shell-bg);
  color: var(--dsw-alias-label-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  line-height: 20px;
}

.demo-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 10px 12px;
  margin-bottom: 16px;
  border: 1px solid var(--demo-shell-line);
  border-radius: 10px;
  background: var(--dsw-alias-bg-base);
}

.demo-bar strong { font-weight: 600; }
.demo-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--dsw-alias-label-secondary); }
.demo-bar select,
.demo-bar input[type="range"] { font: inherit; color: inherit; }
.demo-bar select {
  padding: 2px 6px;
  border: 1px solid var(--demo-shell-line);
  border-radius: 6px;
  background: var(--dsw-alias-bg-base);
}
.demo-bar .demo-width { width: 180px; }
.demo-bar output { color: var(--dsw-alias-label-tertiary); font-variant-numeric: tabular-nums; }
.demo-bar .demo-hint { color: var(--dsw-alias-label-tertiary); font-size: 12px; }

.demo-frame {
  width: 620px;
  max-width: 100%;
  margin: 0 auto;
  border: 1px solid var(--demo-shell-line);
  border-radius: 12px;
  background: var(--dsw-alias-bg-base);
  overflow: hidden;
  transition: width 120ms ease;
}

/* harness 提供的标签条（示意，不由本插件控制，仅用于看上下文） */
.demo-tabs {
  display: flex;
  gap: 16px;
  padding: 0 12px;
  border-bottom: 1px solid var(--demo-shell-line);
  color: var(--dsw-alias-label-tertiary);
}
.demo-tab { padding: 8px 0; }
.demo-tab[data-active="true"] {
  color: var(--dsw-alias-label-primary);
  font-weight: 500;
  box-shadow: inset 0 -2px 0 var(--dsw-alias-label-primary);
}

.demo-note {
  max-width: 900px;
  margin: 16px auto 0;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}
.demo-note code {
  padding: 0 4px;
  border-radius: 4px;
  background: var(--dsw-alias-bg-layer-2);
  color: var(--dsw-alias-label-secondary);
}

/* ───────────────────────── 3. MCP 视图样式（候选设计；定稿后替换 styles.ts 的 CSS 段） ───────────────────────── */
.dsh-mcp-root {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 20px;
  /* 页边距：百分比 padding 以包含块宽度为基准，四边均为整体宽度的 1% */
  padding: 1%;
}

/* 方案 A：现状（两个文字按钮平铺在顶部） */
.dsh-mcp-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.dsh-mcp-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 0.5px solid var(--dsw-alias-border-l1);
  border-radius: 8px;
  background: var(--dsw-specific-tip);
  color: var(--dsw-alias-label-primary);
  font-size: 12px;
  line-height: 20px;
  cursor: pointer;
}

.dsh-mcp-button:hover:not(:disabled) {
  border-color: var(--dsw-alias-border-l2);
}

.dsh-mcp-button:disabled {
  color: var(--dsw-alias-label-tertiary);
  cursor: default;
}

/* 方案 B / C：视图头部（左侧标题 + 计数，右侧图标操作） */
.dsh-mcp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}

.dsh-mcp-heading {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.dsh-mcp-heading-title {
  font-size: 13px;
  line-height: 24px;
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
}

.dsh-mcp-count {
  font-size: 12px;
  line-height: 20px;
  color: var(--dsw-alias-label-caption);
  font-variant-numeric: tabular-nums;
}

.dsh-mcp-actions {
  display: flex;
  flex: none;
  align-items: center;
  gap: 2px;
}

/* 图标按钮：默认无边框、无底色；仅 hover / focus 时浮出，减少视觉重量 */
.dsh-mcp-icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  cursor: pointer;
}

.dsh-mcp-icon-button:hover:not(:disabled) {
  background: var(--dsw-specific-tip);
  color: var(--dsw-alias-label-primary);
}

.dsh-mcp-icon-button:focus-visible {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 1px;
}

.dsh-mcp-icon-button:disabled {
  color: var(--dsw-alias-label-caption);
  cursor: default;
}

.dsh-mcp-icon-button svg {
  width: 15px;
  height: 15px;
}

/* 处理中：转圈而不是文字，位置就在刷新按钮里 */
@keyframes dsh-mcp-spin { to { transform: rotate(360deg); } }
.dsh-mcp-spin { animation: dsh-mcp-spin 0.9s linear infinite; }

/* 方案 C：列表末尾的虚线「添加」行 */
.dsh-mcp-add-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 8px 12px;
  border: 1px dashed var(--dsw-alias-border-l2);
  border-radius: 12px;
  background: transparent;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
  line-height: 20px;
  cursor: pointer;
}

.dsh-mcp-add-row:hover:not(:disabled) {
  border-color: var(--dsw-alias-label-caption);
  color: var(--dsw-alias-label-secondary);
}

.dsh-mcp-add-row:focus-visible {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 1px;
}

.dsh-mcp-add-row svg { width: 14px; height: 14px; }

/* 文件选择器只作为「添加」入口的隐藏实现：点击按钮即打开系统选文件对话框 */
.dsh-mcp-file {
  display: none;
}

.dsh-mcp-status {
  font-size: 12px;
  line-height: 20px;
  color: var(--dsw-alias-label-tertiary);
}

.dsh-mcp-error {
  min-width: 0;
  font-size: 12px;
  line-height: 20px;
  color: var(--dsw-alias-state-error-primary);
  overflow-wrap: anywhere;
}

.dsh-mcp-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.dsh-mcp-group-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 12px;
  min-width: 0;
}

.dsh-mcp-group-title {
  font-size: 13px;
  line-height: 24px;
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
}

.dsh-mcp-group-source {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  font-size: 12px;
  line-height: 20px;
  color: var(--dsw-alias-label-tertiary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dsh-mcp-source-label {
  margin-right: 6px;
  color: var(--dsw-alias-label-caption);
}

/* 分组标题右侧：来源路径 + 卸载按钮（min-width:0 让长路径继续省略号收尾） */
.dsh-mcp-group-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

/* 卸载：默认与「来源」同色的弱按钮；进入确认态才用警示色 */
.dsh-mcp-unload {
  flex: none;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--dsw-alias-label-tertiary);
  font: inherit;
  font-size: 12px;
  line-height: 20px;
  white-space: nowrap;
  cursor: pointer;
}

.dsh-mcp-unload:hover:not(:disabled) { color: var(--dsw-alias-label-secondary); }
.dsh-mcp-unload[data-confirm="true"] { color: var(--dsw-alias-state-error-primary); font-weight: 500; }
.dsh-mcp-unload:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }

.dsh-mcp-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.dsh-mcp-server {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 10px 12px;
  border: 0.5px solid var(--dsw-alias-border-l1);
  border-radius: 12px;
  background: var(--dsw-specific-tip);
}

.dsh-mcp-server-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.dsh-mcp-server-name {
  min-width: 0;
  font-size: 13px;
  line-height: 20px;
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
  overflow-wrap: anywhere;
}

.dsh-mcp-transport {
  flex: none;
  padding: 1px 6px;
  border: 0.5px solid var(--dsw-alias-border-l1);
  border-radius: 6px;
  font-size: 11px;
  line-height: 16px;
  font-weight: 500;
}

.dsh-mcp-transport-stdio {
  color: var(--dsw-alias-state-business-primary);
}

.dsh-mcp-transport-http {
  color: var(--dsw-alias-state-success-primary);
}

.dsh-mcp-tools {
  min-width: 0;
  font-size: 12px;
  line-height: 18px;
  color: var(--dsw-alias-label-secondary);
  overflow-wrap: anywhere;
}

/* 工具名一行容器：文字在左、展开/收起在右下角 */
.dsh-mcp-tools-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  min-width: 0;
}

/* 折到 2 行；只有真正超出时才由脚本保留（不足 2 行会移除本类并隐藏按钮） */
.dsh-mcp-tools-clamped {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

.dsh-mcp-tools-toggle {
  flex: none;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--dsw-alias-label-tertiary);
  font: inherit;
  font-size: 12px;
  line-height: 18px;
  white-space: nowrap;
  cursor: pointer;
}

.dsh-mcp-tools-toggle:hover {
  color: var(--dsw-alias-label-secondary);
}

.dsh-mcp-tools-toggle:focus-visible {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 1px;
}

.dsh-mcp-empty {
  font-size: 13px;
  line-height: 20px;
  color: var(--dsw-alias-label-tertiary);
}

/* 服务行的三个方案：S1 为上面 .dsh-mcp-server 的默认样式，S2/S3 只覆盖差异 */
/* S2：去掉底色，只留发丝边框——表面跟随面板，更轻 */
.dsh-mcp-root[data-servers="s2"] .dsh-mcp-server {
  background: transparent;
}

/* S3：去掉卡片，改成带分隔线的紧凑列表 */
.dsh-mcp-root[data-servers="s3"] .dsh-mcp-list {
  gap: 0;
}

.dsh-mcp-root[data-servers="s3"] .dsh-mcp-server {
  gap: 4px;
  padding: 10px 0;
  border: none;
  border-radius: 0;
  background: transparent;
}

/* 只在相邻服务之间画一条发丝分隔线（首个不画） */
.dsh-mcp-root[data-servers="s3"] .dsh-mcp-list > .dsh-mcp-server + .dsh-mcp-server {
  border-top: 0.5px solid var(--dsw-alias-border-l1);
}
</style>
</head>
<body>

<header class="demo-bar">
  <strong>「MCP」标签页 · 显示演示</strong>
  <label>工具条方案
    <select id="variant">
      <option value="B">B 视图头部（推荐）</option>
      <option value="C">C 头部 + 末尾添加行</option>
      <option value="A">A 现状（对照）</option>
    </select>
  </label>
  <label>服务行
    <select id="servers">
      <option value="s1">S1 有底色卡片（现状）</option>
      <option value="s2">S2 仅发丝边框</option>
      <option value="s3">S3 去卡片·分隔线列表</option>
    </select>
  </label>
  <label>主题
    <select id="theme">
      <option value="light">浅色</option>
      <option value="dark">深色</option>
    </select>
  </label>
  <label>状态
    <select id="state">
      <option value="normal">正常（三组）</option>
      <option value="globalOnly">仅全局</option>
      <option value="empty">空态（无 MCP）</option>
      <option value="busy">忙碌（处理中）</option>
      <option value="error">错误提示</option>
      <option value="long">超长内容</option>
    </select>
  </label>
  <label>容器宽度
    <input id="width" class="demo-width" type="range" min="280" max="900" step="20" value="620">
  </label>
  <output id="widthOut">620px</output>
  <span class="demo-hint">把鼠标放到右上角图标上可看 hover 反馈</span>
</header>

<main>
  <div class="demo-frame" id="frame">
    <div class="demo-tabs">
      <span class="demo-tab">对话</span>
      <span class="demo-tab">轨迹</span>
      <span class="demo-tab" data-active="true">MCP</span>
    </div>
    <div id="mount"></div>
  </div>
</main>

<footer class="demo-note">
  结构与类名对应 <code>src/client/McpView.tsx</code>；样式对应 <code>src/client/styles.ts</code>。
  上方标签条由 harness 提供、不由本插件控制，此处仅示意上下文。
  三个工具的差别：<code>A</code> 两个文字按钮平铺；<code>B</code> 标题 + 计数在左、图标操作在右；
  <code>C</code> 在 B 基础上把「添加」改成列表末尾的虚线行。
  分组标题右侧的「卸载」按钮为纯展示（演示页没有宿主），全局共享刻意不给入口。
</footer>

<script>
/**
 * 样例数据：形状对应 src/contract.ts 的 McpMountedData。
 * 内容参考本机真实配置（~/.dsh/.mcp.json 的 postgres / Machine-API）。
 */
const SAMPLES = {
  global: {
    file: '/Users/loulan/.dsh/.mcp.json',
    servers: [
      {
        name: 'postgres',
        transport: 'stdio',
        tools: ['list_schemas', 'list_objects', 'get_object_details', 'explain_query',
          'analyze_workload_indexes', 'analyze_query_indexes', 'analyze_db_health',
          'get_top_queries', 'execute_sql'],
      },
      {
        name: 'Machine-API',
        transport: 'stdio',
        tools: ['read_project_oas_du6sp6', 'read_project_oas_ref_resources_du6sp6'],
      },
    ],
  },
  workspace: {
    file: '/Users/loulan/Downloads/TEST/test02/.mcp.json',
    servers: [
      { name: 'postgres', transport: 'stdio', tools: ['list_schemas', 'execute_sql'] },
    ],
  },
  manual: {
    file: 'extra-mcp.json',
    servers: [
      { name: 'remote-api', transport: 'streamable-http', tools: [] },
    ],
  },
};

const EMPTY = { global: { servers: [] }, workspace: { servers: [] }, manual: { servers: [] } };

const LONG = {
  global: {
    file: '/Users/loulan/.dsh/.mcp.json',
    servers: [
      {
        name: 'a-very-long-mcp-server-name-that-needs-wrapping',
        transport: 'streamable-http',
        tools: Array.from({ length: 24 }, (_, i) => `some_fairly_long_tool_name_${i + 1}`),
      },
      { name: 'tiny', transport: 'stdio', tools: [] },
    ],
  },
  workspace: { servers: [] },
  manual: { servers: [] },
};

/** 各状态：payload + 工具条状态。 */
const STATES = {
  normal: { data: { global: SAMPLES.global, workspace: SAMPLES.workspace, manual: SAMPLES.manual } },
  globalOnly: { data: { global: SAMPLES.global, workspace: { servers: [] }, manual: { servers: [] } } },
  empty: { data: EMPTY },
  busy: {
    data: { global: SAMPLES.global, workspace: SAMPLES.workspace, manual: SAMPLES.manual },
    pending: true,
  },
  error: {
    data: { global: SAMPLES.global, workspace: SAMPLES.workspace, manual: SAMPLES.manual },
    error: '刷新失败：有会话正在运行，请稍后再刷新',
  },
  long: { data: LONG },
};

/** 文案：与 src/client/locales.ts 的中文词典一致（新增项待回写词典）。 */
const T = {
  heading: 'MCP 服务',
  refresh: '刷新',
  add: '添加 .mcp.json',
  busy: '处理中…',
  empty: '本会话未加载 MCP 服务',
  workspace: '本工作区',
  manual: '手动添加',
  global: '全局共享',
  source: '来源',
  toolsUnavailable: '工具列表暂不可用',
  separator: '、',
  expand: '展开',
  collapse: '收起',
  unload: '卸载',
  unloadConfirm: '确认卸载',
};

/** 传输方式对应的 pill 类名（对应 McpView.tsx 的 TRANSPORT_CLASS）。 */
const TRANSPORT_CLASS = {
  'stdio': 'dsh-mcp-transport-stdio',
  'streamable-http': 'dsh-mcp-transport-http',
};

/** 图标：内联 SVG，随文字颜色走（stroke="currentColor"）。 */
const ICON = {
  refresh: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 8a5.4 5.4 0 1 0-1.6 3.9"/><path d="M13.4 3.6v4h-4"/></svg>',
  refreshSpin: '<svg class="dsh-mcp-spin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="5.4" opacity="0.25"/><path d="M13.4 8a5.4 5.4 0 0 0-4-5.2"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>',
};

/**
 * 创建一个元素。
 *
 * @param {string} tag - 标签名
 * @param {string} [className] - 类名
 * @param {string} [text] - 文本内容
 * @returns {HTMLElement} 元素
 */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className !== undefined) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/**
 * 创建「添加 .mcp.json」入口：label 包一个隐藏 file input，点击即打开系统选文件对话框。
 *
 * @param {string} className - 入口按钮的类名
 * @param {boolean} withText - 是否带文字（方案 C 的虚线行带文字，图标按钮不带）
 * @returns {HTMLElement} label 元素
 */
function addEntry(className, withText) {
  const label = el('label', className);
  label.title = T.add;
  if (withText) label.append(el('span', undefined, T.add));
  label.insertAdjacentHTML('afterbegin', ICON.plus);
  const input = el('input', 'dsh-mcp-file');
  input.type = 'file';
  input.accept = '.json,application/json';
  label.append(input);
  return label;
}

/**
 * 渲染工具条/头部（对应 McpView 顶部区域；三个方案结构不同）。
 *
 * @param {{pending?: boolean, error?: string}} state - 状态
 * @param {number} total - 服务总数（计数徽标用）
 * @param {string} variant - 方案 A / B / C
 * @returns {HTMLElement[]} 头部节点列表（状态/错误行单独成行）
 */
function renderHead(state, total, variant) {
  const nodes = [];
  const busy = state.pending === true;

  if (variant === 'A') {
    const toolbar = el('div', 'dsh-mcp-toolbar');
    const refresh = el('button', 'dsh-mcp-button', T.refresh);
    refresh.type = 'button';
    refresh.disabled = busy;
    toolbar.append(refresh, addEntry('dsh-mcp-button', true));
    if (busy) toolbar.append(el('span', 'dsh-mcp-status', T.busy));
    if (state.error !== undefined) toolbar.append(el('span', 'dsh-mcp-error', state.error));
    return [toolbar];
  }

  const header = el('div', 'dsh-mcp-header');
  const heading = el('div', 'dsh-mcp-heading');
  heading.append(el('span', 'dsh-mcp-heading-title', T.heading));
  heading.append(el('span', 'dsh-mcp-count', `${total} 个`));
  header.append(heading);

  const actions = el('div', 'dsh-mcp-actions');
  const refresh = el('button', 'dsh-mcp-icon-button');
  refresh.type = 'button';
  refresh.disabled = busy;
  refresh.title = T.refresh;
  refresh.innerHTML = busy ? ICON.refreshSpin : ICON.refresh;
  actions.append(refresh);
  if (variant === 'B') actions.append(addEntry('dsh-mcp-icon-button', false));
  header.append(actions);
  nodes.push(header);

  if (state.error !== undefined) nodes.push(el('div', 'dsh-mcp-error', state.error));
  return nodes;
}

/**
 * 渲染一个服务的工具名行：默认折到 2 行，超出时在右下角给「展开／收起」。
 *
 * 是否真的超出要等排版后才能判断，故先渲染按钮，再由 refineToolRows() 收掉多余按钮。
 *
 * @param {{tools: string[]}} server - 服务条目
 * @returns {HTMLElement} 工具名行
 */
function toolsRow(server) {
  const row = el('div', 'dsh-mcp-tools-row');
  if (server.tools.length === 0) {
    row.append(el('span', 'dsh-mcp-tools', T.toolsUnavailable));
    return row;
  }

  const text = el('span', 'dsh-mcp-tools dsh-mcp-tools-clamped', server.tools.join(T.separator));
  const toggle = el('button', 'dsh-mcp-tools-toggle', T.expand);
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', () => {
    const clamped = text.classList.toggle('dsh-mcp-tools-clamped');
    toggle.textContent = clamped ? T.expand : T.collapse;
    toggle.setAttribute('aria-expanded', String(!clamped));
  });

  row.append(text, toggle);
  return row;
}

/**
 * 排版后收拾工具名行：没超出 2 行的，去掉折行类并移除「展开」按钮。
 *
 * @param {HTMLElement} root - 视图根节点
 */
function refineToolRows(root) {
  for (const text of root.querySelectorAll('.dsh-mcp-tools-clamped')) {
    if (text.scrollHeight > text.clientHeight + 1) continue;
    text.classList.remove('dsh-mcp-tools-clamped');
    text.parentElement?.querySelector('.dsh-mcp-tools-toggle')?.remove();
  }
}

/**
 * 卸载按钮（纯展示）：第一次点击进入确认态，第二次才“卸”，失焦即取消。
 *
 * @returns {HTMLElement} 卸载按钮
 */
function unloadButton() {
  const button = el('button', 'dsh-mcp-unload', T.unload);
  button.type = 'button';
  button.dataset.confirm = 'false';
  button.title = T.unload;
  button.addEventListener('click', () => {
    const confirming = button.dataset.confirm === 'true';
    button.dataset.confirm = confirming ? 'false' : 'true';
    button.textContent = confirming ? T.unload : T.unloadConfirm;
  });
  button.addEventListener('blur', () => {
    button.dataset.confirm = 'false';
    button.textContent = T.unload;
  });
  return button;
}

/**
 * 渲染一个来源分组；空组返回 null（与 McpView.renderGroup 一致）。
 *
 * @param {string} title - 分组标题
 * @param {{file?: string, servers: Array}} group - 分组数据
 * @param {boolean} unloadable - 是否可卸载（全局共享为 false，无入口）
 * @returns {HTMLElement|null} 分组节点
 */
function renderGroup(title, group, unloadable) {
  if (group.servers.length === 0) return null;
  const section = el('section', 'dsh-mcp-group');

  const head = el('div', 'dsh-mcp-group-head');
  head.append(el('span', 'dsh-mcp-group-title', title));
  if (group.file !== undefined || unloadable === true) {
    const meta = el('span', 'dsh-mcp-group-meta');
    if (group.file !== undefined) {
      const source = el('span', 'dsh-mcp-group-source');
      source.title = group.file;
      source.append(el('span', 'dsh-mcp-source-label', T.source), document.createTextNode(group.file));
      meta.append(source);
    }
    if (unloadable === true) meta.append(unloadButton());
    head.append(meta);
  }
  section.append(head);

  const list = el('ul', 'dsh-mcp-list');
  for (const server of group.servers) {
    const item = el('li', 'dsh-mcp-server');

    const serverHead = el('div', 'dsh-mcp-server-head');
    serverHead.append(el('span', 'dsh-mcp-server-name', server.name));
    serverHead.append(el('span', `dsh-mcp-transport ${TRANSPORT_CLASS[server.transport]}`, server.transport));
    item.append(serverHead);
    item.append(toolsRow(server));
    list.append(item);
  }
  section.append(list);
  return section;
}

/**
 * 渲染整个视图（对应 McpView 的返回结构）。
 *
 * @param {{data: object, pending?: boolean, error?: string}} state - 当前演示状态
 * @param {string} variant - 工具条方案
 * @param {string} servers - 服务行方案（s1/s2/s3，写在根节点 data-servers 上）
 * @returns {HTMLElement} 视图根节点
 */
function render(state, variant, servers) {
  const root = el('div', 'dsh-mcp-root');
  root.dataset.servers = servers;
  const { global: g, workspace: w, manual: m } = state.data;
  const total = g.servers.length + w.servers.length + m.servers.length;

  for (const node of renderHead(state, total, variant)) root.append(node);

  const isEmpty = w.servers.length === 0 && m.servers.length === 0 && g.servers.length === 0;
  if (isEmpty) {
    root.append(el('div', 'dsh-mcp-empty', T.empty));
  } else {
    for (const node of [renderGroup(T.workspace, w, true), renderGroup(T.manual, m, true), renderGroup(T.global, g, false)]) {
      if (node !== null) root.append(node);
    }
  }
  // 方案 C：把「添加」放在列表末尾（空态时也显示，作为主要行动点）。
  if (variant === 'C') {
    const addRow = addEntry('dsh-mcp-add-row', true);
    if (state.pending === true) addRow.style.pointerEvents = 'none';
    root.append(addRow);
  }
  return root;
}

const mount = document.getElementById('mount');
const themeSelect = document.getElementById('theme');
const stateSelect = document.getElementById('state');
const variantSelect = document.getElementById('variant');
const serverSelect = document.getElementById('servers');
const widthInput = document.getElementById('width');
const widthOut = document.getElementById('widthOut');
const frame = document.getElementById('frame');

/** 按当前选择重绘。 */
function update() {
  document.documentElement.dataset.theme = themeSelect.value;
  frame.style.width = `${widthInput.value}px`;
  widthOut.value = `${widthInput.value}px`;
  mount.replaceChildren(render(STATES[stateSelect.value], variantSelect.value, serverSelect.value));
  refineToolRows(mount);
}

themeSelect.addEventListener('change', update);
stateSelect.addEventListener('change', update);
variantSelect.addEventListener('change', update);
serverSelect.addEventListener('change', update);
widthInput.addEventListener('input', update);
update();
</script>
</body>
</html>
