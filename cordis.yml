# 多插件开发项目的本地覆盖层（patch overlay）。
#
# `name` 使用相对路径：loader 按**本 patch 文件所在目录**解析（harness 的
# anchorInsertedPluginNames 会把 ./ 开头的 name 解析为相对本文件的绝对路径），
# 因此整个项目可以整体移动，无需改路径；只有当插件目录相对本文件的位置发生变化时，
# 才需要同步修改下面三条 name。

- insert:
    - id: dsh-loulan-hello
      name: ./packages/hello/src/index.ts

    - id: dsh-loulan-mcp
      name: ./packages/mcp/src/index.ts

    - id: dsh-loulan-rules
      name: ./packages/rules/src/index.ts

